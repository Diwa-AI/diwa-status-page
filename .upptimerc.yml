# Upptime configuration for the Diwa AI public status page.
#
# This is the live config for the diwa-ai/diwa-status-page repo: the
# `.github/workflows/*.yml` files read this to run checks, build the status
# site, and update README.md/history/api/graphs. Edit this file and push -
# no other setup is required.

owner: diwa-ai
repo: diwa-status-page

# Endpoints to monitor. v1 only checks external, customer-facing URLs that
# actually have a live, public address today - no internal component
# breakdown (DB/Redis/Sidekiq/AI pipeline internals), per DIWA-543.
#
# The Status Page.pdf mockup (DIWA-543) also shows "Web App & Dashboard"
# (app.diwa.ai), "API" (api.diwa.ai), and three AI pipeline stages (AI
# Analysis Engine, Highlight Reel Processing, Transcription Service).
# Notes on what's checked and how:
#   - app.diwa.ai / api.diwa.ai still have no public DNS record, so there's
#     no dedicated subdomain to check yet. The Rails app (diwa_ai) serves
#     the marketing site, dashboard, and API from the same www.diwa.ai host
#     (see config/environments/production.rb's APP_HOST default), so "Diwa
#     API" below is checked via its public health route on that host
#     (/api/v1/health) until api.diwa.ai gets its own DNS record.
#   - The AI pipeline stages are internal processing components with no
#     public HTTP endpoint, and are an explicit v1 non-goal in TICKET.md.
# Once a dedicated subdomain goes live, switch the relevant entry's `url`
# to it (e.g. api.diwa.ai) rather than the /api/v1/health path.
sites:
  - name: Diwa AI
    url: https://www.diwa.ai
  - name: Diwa API
    url: https://www.diwa.ai/api/v1/health

# Status website settings (the static page generated on the gh-pages branch).
status-website:
  baseUrl: /
  name: Diwa AI Status
  navbar:
    - title: diwa.ai
      href: https://www.diwa.ai
  introMessage: >
    This page updates automatically from live checks against Diwa AI's
    public services.

# Optional: uncomment to have Upptime post to a Slack webhook when a check
# fails/recovers. Requires a `SLACK_WEBHOOK_URL` repository secret. Not
# required for v1 - customer email/SMS subscriptions are an explicit
# non-goal, but this is a low-effort way to get internal alerting for free.
# notifications:
#   - type: slack
#     url: $SLACK_WEBHOOK_URL
