# Upptime configuration for the Diwa AI public status page.
#
# This file is NOT consumed by this Rails app. It's the config to copy into
# the root of the separate public GitHub repo created from the
# `upptime/upptime` template (see README.md in this folder for the full
# setup steps). Fill in `owner` and `repo` before pushing.

owner: jasper-diwa-ai
repo: diwa-status

# Endpoints to monitor. v1 only checks external, customer-facing URLs -
# no internal component breakdown (DB/Redis/Sidekiq), per DIWA-543.
sites:
  - name: Website
    url: https://www.diwa.ai

# Status website settings (the static page generated on the gh-pages branch).
status-website:
  cname: status.diwa.ai
  name: Diwa AI Status
  introMessage: >
    This page updates automatically from live checks against Diwa AI's
    public services.

# Optional: uncomment to have Upptime post to a Slack webhook when a check
# fails/recovers. Requires a `SLACK_WEBHOOK_URL` repository secret. Not
# required for v1 - customer email/SMS subscriptions are an explicit
# non-goal, but this is a low-effort way to get internal alerting for free.
# notifications:
#   - type: slack
#     url: $SLACK_WEBHOOK_URL
