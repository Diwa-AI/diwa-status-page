# Automatic triggers disabled: this command re-generates the standard
# Upptime workflow files (including the old site.yml) from the upstream
# template, which would silently revert .github/workflows/site.yml back to
# deploying Upptime's default Svelte site instead of our custom one (see
# web/, scripts/build-status-data.mjs). Left as workflow_dispatch only in
# case someone wants to manually pull in updates to the OTHER generated
# workflows (uptime.yml, response-time.yml, graphs.yml, summary.yml) - just
# remember to re-apply the site.yml customization afterward if you do.
#
# 🔼 Upptime @v1.43.15
# GitHub-powered open-source uptime monitor and status page by Anand Chowdhary
# * Source: https://github.com/upptime/upptime
# * Docs and more: https://upptime.js.org

name: Update Template CI
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update template
        uses: upptime/uptime-monitor@master
        with:
          command: "update-template"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
