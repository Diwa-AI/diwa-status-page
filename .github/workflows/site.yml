# Builds and deploys the custom Diwa AI status page (see web/, scripts/).
#
# This intentionally replaces Upptime's default generated Svelte site with
# our own static page so the design matches DIWA-543's mockup. Because of
# that, this file is no longer managed by Upptime's "update-template"
# command - see the note in .github/workflows/update-template.yml, which
# has had its automatic triggers disabled so it can't silently overwrite
# this workflow.

name: Static Site CI
on:
  push:
    paths:
      - "assets/**"
      - "web/**"
      - "scripts/**"
      - "package.json"
      - ".upptimerc.yml"
  schedule:
    - cron: "0 1 * * *"
  repository_dispatch:
    types: [static_site]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Build and deploy site
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build status page
        run: npm run build
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
      - uses: peaceiris/actions-gh-pages@v4
        name: GitHub Pages Deploy
        with:
          github_token: ${{ secrets.GH_PAT || github.token }}
          publish_dir: "web-dist/"
          force_orphan: "false"
          user_name: "Upptime Bot"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
